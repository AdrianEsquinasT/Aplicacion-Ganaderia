<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mi Ganadería">
  <title>Mi Ganadería</title>
  <rect width="512" height="512" rx="0" fill="#363b1b"/>
  <g clip-path="url(#recorte)">
  <defs><clipPath id="recorte"><rect width="512" height="512" rx="0"/></clipPath></defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58602b"/><stop offset="1" stop-color="#363b1b"/></linearGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b074"/><stop offset=".65" stop-color="#d4975a"/><stop offset="1" stop-color="#bd7a40"/></linearGradient>
    <linearGradient id="cuerno" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e9dcb8"/><stop offset="1" stop-color="#fbf4de"/></linearGradient>
  </defs>
  <!-- colinas -->
  <path d="M0 452 C 110 408 215 432 256 446 C 330 470 420 414 512 440 L512 512 L0 512 Z" fill="#79a24b"/>
  <path d="M0 478 C 130 446 230 470 300 480 C 380 492 450 462 512 472 L512 512 L0 512 Z" fill="#5c8a37"/>
  <!-- brote entre los cuernos -->
  <path d="M256 150 C 256 128 256 112 256 96" stroke="#6f9a43" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M256 112 C 226 112 204 92 202 62 C 232 62 254 82 256 112 Z" fill="#9bcc62"/>
  <path d="M256 98 C 284 98 306 80 310 52 C 280 52 258 70 256 98 Z" fill="#76a846"/>
